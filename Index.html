<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Territory Runner</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .ui-layer { z-index: 1000; }
  </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden relative">

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Top Floating Header -->
  <div class="ui-layer fixed top-4 left-4 right-4 bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-gray-100 flex justify-between items-center">
    <div>
      <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">พื้นที่ที่ยึดได้</p>
      <h1 class="text-xl font-extrabold text-gray-800"><span id="areaVal">0</span> <span class="text-sm font-normal text-gray-600">ตร.ม.</span></h1>
    </div>
    <div class="text-right">
      <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">สถานะ GPS</p>
      <span id="gpsStatus" class="inline-flex items-center text-xs font-semibold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full mt-1">
        <span class="w-2 h-2 mr-1.5 bg-amber-500 rounded-full animate-ping"></span> กำลังค้นหา...
      </span>
    </div>
  </div>

  <!-- Bottom Action Bar (Touch Targets > 48px) -->
  <div class="ui-layer fixed bottom-6 left-4 right-4 flex gap-3">
    <button id="btnTrack" onclick="toggleTracking()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold h-14 rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all">
      <i data-lucide="play" class="w-6 h-6"></i>
      <span id="btnText" class="text-lg">เริ่มวิ่งยึดเมือง</span>
    </button>

    <button onclick="clearTerritory()" class="bg-white hover:bg-gray-50 text-gray-700 font-bold w-14 h-14 rounded-2xl shadow-xl border border-gray-100 flex items-center justify-center active:scale-95 transition-all">
      <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
    </button>
  </div>

  <script>
    let map, userMarker, pathLine, territoryPolygon;
    let pathCoordinates = [];
    let watchId = null;
    let isTracking = false;

    // Initialize Map
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([13.7563, 100.5018], 15);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Custom User Marker Icon
      const userIcon = L.divIcon({
        className: 'custom-user-icon',
        html: `<div class="w-5 h-5 bg-blue-600 border-2 border-white rounded-full shadow-md animate-pulse"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      userMarker = L.marker([0, 0], { icon: userIcon }).addTo(map);

      // Layers for Path and Polygon
      pathLine = L.polyline([], { color: '#059669', weight: 4, dashArray: '6, 8' }).addTo(map);
      territoryPolygon = L.polygon([], { color: '#10b981', fillColor: '#34d399', fillOpacity: 0.4, weight: 3 }).addTo(map);

      startGPSObserver();
    }

    // Monitor GPS Position
    function startGPSObserver() {
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            const currentLatLng = [latitude, longitude];

            userMarker.setLatLng(currentLatLng);
            
            document.getElementById('gpsStatus').className = "inline-flex items-center text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full mt-1";
            document.getElementById('gpsStatus').innerHTML = `<span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full"></span> พร้อมใช้งาน`;

            if (isTracking) {
              pathCoordinates.push(currentLatLng);
              pathLine.setLatLngs(pathCoordinates);
              territoryPolygon.setLatLngs(pathCoordinates);
              map.panTo(currentLatLng);
              calculateArea();
            }
          },
          (err) => {
            document.getElementById('gpsStatus').className = "inline-flex items-center text-xs font-semibold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full mt-1";
            document.getElementById('gpsStatus').innerHTML = `<span class="w-2 h-2 mr-1.5 bg-rose-500 rounded-full"></span> ไม่พบสัญญาณ`;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    // Start / Stop Run Tracking
    function toggleTracking() {
      isTracking = !isTracking;
      const btn = document.getElementById('btnTrack');
      const btnText = document.getElementById('btnText');

      if (isTracking) {
        btn.className = "flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold h-14 rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all";
        btnText.innerText = "หยุดวิ่ง (ยึดพื้นที่)";
        lucide.createIcons();
      } else {
        btn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold h-14 rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all";
        btnText.innerText = "เริ่มวิ่งยึดเมือง";
      }
    }

    // Calculate Polygon Area (m²)
    function calculateArea() {
      if (pathCoordinates.length < 3) return;
      const latLngs = territoryPolygon.getLatLngs()[0];
      let area = 0;
      if (latLngs.length > 2) {
        // Approximate planar area calculation
        area = L.GeometryUtil ? L.GeometryUtil.geodesicArea(latLngs) : estimateArea(latLngs);
      }
      document.getElementById('areaVal').innerText = Math.round(area).toLocaleString();
    }

    function estimateArea(latLngs) {
      let area = 0;
      const radius = 6378137;
      for (let i = 0; i < latLngs.length; i++) {
        const p1 = latLngs[i];
        const p2 = latLngs[(i + 1) % latLngs.length];
        area += (p2.lng - p1.lng) * (Math.PI / 180) * (2 + Math.sin(p1.lat * (Math.PI / 180)) + Math.sin(p2.lat * (Math.PI / 180)));
      }
      return Math.abs(area * radius * radius / 2);
    }

    // Reset Data
    function clearTerritory() {
      pathCoordinates = [];
      pathLine.setLatLngs([]);
      territoryPolygon.setLatLngs([]);
      document.getElementById('areaVal').innerText = "0";
    }

    window.onload = () => {
      initMap();
      lucide.createIcons();
    };
  </script>
</body>
</html>
